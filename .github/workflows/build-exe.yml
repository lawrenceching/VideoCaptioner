name: Build standalone executables

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (e.g. 1.5.0)"
        required: false
        default: ""
        type: string
      release_title:
        description: "Release title — if set, publish a GitHub Release"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: win-x64
          - runner: windows-11-arm
            target: win-arm64
          - runner: ubuntu-latest
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-latest
            target: mac-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -e .

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-ci" >> "$GITHUB_OUTPUT"
          fi

      - name: Build executable
        run: python scripts/build_exe.py --clean --version ${{ steps.version.outputs.value }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: videocaptioner-${{ matrix.target }}
          path: dist/videocaptioner/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: inputs.release_title != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create archives
        shell: bash
        run: |
          VER="${{ inputs.version }}"
          if [[ -z "$VER" ]]; then
            VER="0.0.0-ci"
          fi
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            target="${name#videocaptioner-}"
            chmod +x "$dir"/videocaptioner 2>/dev/null || true
            if [[ "$target" == win-* ]]; then
              (cd "$dir" && zip -qr "../../videocaptioner-${VER}-${target}.zip" .)
            else
              tar -czf "videocaptioner-${VER}-${target}.tar.gz" -C "$dir" .
            fi
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.release_title }}" \
            videocaptioner-*.zip videocaptioner-*.tar.gz \
            --title "${{ inputs.release_title }}" \
            --notes "Build triggered manually."
